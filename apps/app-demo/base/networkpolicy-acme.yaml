# Laisse Traefik joindre le pod temporaire de cert-manager pendant la validation Let's Encrypt (HTTP-01)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-acme-solver
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8089 }
