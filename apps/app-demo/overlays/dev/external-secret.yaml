# Activé à l'étape « Secrets » du ROADMAP (kustomize edit add resource external-secret.yaml)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-demo-secrets
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: app-demo-secrets
  data:
    - secretKey: password
      remoteRef:
        key: gitops/dev/app-demo
        property: password
