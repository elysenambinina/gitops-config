apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-dev
resources:
  - ../../base
images:
  - name: app-demo
    newName: 043262085702.dkr.ecr.eu-west-3.amazonaws.com/app-demo
    newTag: "a-remplacer-par-la-ci"
patches:
  - target: { kind: Deployment, name: app-demo }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
