# Remplace bootstrap/apps/kyverno.yaml à l'étape « Supervision » (après l'installation de Prometheus)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: "3.9.2"
    helm:
      valuesObject:
        admissionController:
          replicas: 3
          serviceMonitor:
            enabled: true
        backgroundController:
          replicas: 2
          serviceMonitor:
            enabled: true
        reportsController:
          replicas: 2
          serviceMonitor:
            enabled: true
        cleanupController:
          replicas: 2
        features:
          policyExceptions:
            enabled: true
            namespace: kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
