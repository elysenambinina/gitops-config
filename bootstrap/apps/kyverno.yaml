# À déplacer dans bootstrap/apps/ à l'étape « Politiques » du ROADMAP
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: "3.9.2"
    helm:
      valuesObject:
        admissionController:
          replicas: 3
        backgroundController:
          replicas: 2
        reportsController:
          replicas: 2
        cleanupController:
          replicas: 2
        features:
          policyExceptions:
            enabled: true
            namespace: kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
