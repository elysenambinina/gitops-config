# Tableau de bord « Conformité », chargé automatiquement par Grafana (label grafana_dashboard)
apiVersion: v1
kind: ConfigMap
metadata:
  name: tableau-conformite
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  conformite.json: |
    {
      "title": "Conformité",
      "uid": "conformite",
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Violations par politique (1 h glissante)",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "legendFormat": "{{policy_name}}",
            "expr": "sum by (policy_name) (increase(kyverno_policy_results_total{rule_result=\"fail\"}[1h]))" }]
        },
        {
          "id": 2, "type": "stat", "title": "Admissions refusées (1 h)",
          "gridPos": { "x": 0, "y": 9, "w": 8, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A",
            "expr": "sum(increase(kyverno_admission_requests_total{request_allowed=\"false\"}[1h])) or vector(0)" }]
        },
        {
          "id": 3, "type": "stat", "title": "Applications non synchronisées",
          "gridPos": { "x": 8, "y": 9, "w": 8, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "count(argocd_app_info{sync_status!=\"Synced\"}) or vector(0)" }]
        },
        {
          "id": 4, "type": "stat", "title": "Applications en mauvaise santé",
          "gridPos": { "x": 16, "y": 9, "w": 8, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "count(argocd_app_info{health_status!=\"Healthy\"}) or vector(0)" }]
        }
      ],
      "schemaVersion": 39
    }
