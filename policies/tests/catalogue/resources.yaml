# Un pod conforme à toutes les règles, puis un pod par défaut (chacun n'enfreint qu'une règle)
apiVersion: v1
kind: Pod
metadata:
  name: pod-conforme
  namespace: demo-dev
  labels: { app.kubernetes.io/name: test, owner: dsin }
spec:
  securityContext: { runAsNonRoot: true, runAsUser: 10001 }
  containers:
    - name: app
      image: 043262085702.dkr.ecr.eu-west-3.amazonaws.com/app-demo:sha-test
      securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false }
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { memory: 128Mi }
---
